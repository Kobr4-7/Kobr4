# Déploiement complet sur un serveur : voir deploy/README.md.
name: kobr4

services:
  app:
    build: .
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      KOBR4_DATABASE_URL: postgresql+asyncpg://kobr4:${POSTGRES_PASSWORD}@db:5432/kobr4
    volumes:
      - market-data:/data
      - lab:/lab
    depends_on:
      db:
        condition: service_healthy
    # Les bots doivent survivre à un redémarrage : ils reprennent là où ils étaient.
    stop_grace_period: 30s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kobr4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kobr4
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobr4"]
      interval: 10s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KOBR4_DOMAIN: ${KOBR4_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Supervision (facultative) : docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/secrets/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana:/var/lib/grafana

volumes:
  pg:
  market-data:
  lab:
  caddy-data:
  prometheus:
  grafana:
