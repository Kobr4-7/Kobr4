[project]
name = "kobr4"
version = "0.1.0"
description = "Bot de trading forex Kobr4 FX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "polars>=1.44.2",
    "prometheus-client>=0.26.0",
    "pydantic[email]>=2.8",
    "pyotp>=2.10.0",
    "pyyaml>=6.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kobr4 = "kobr4.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobr4"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/kobr4/backtest/report.py" = ["E501"]
"src/kobr4/lab/cli.py" = ["E501"]
"src/kobr4/live/metrics.py" = ["E501"]
"src/kobr4/live/alerts.py" = ["E501"]
"tests/**" = ["E501", "RUF059"]
"src/kobr4/web/**" = ["E501"]
