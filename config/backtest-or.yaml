# Comparaison de stratégies de tendance sur l'or (XAU/USD, H1).
# Pour l'or, 1 pip = 1 $ : un stop de 25 pips = 25 $ par once.
# Achats seulement (direction: long) : sur 2019-2026, les ventes à découvert perdaient
# pour les trois stratégies (hausse de fond de l'or).
# Lancer : kobr4 backtest --config config/backtest-or.yaml --start 2019-01-01
mode: backtest
base_currency: USD

instruments: [XAU/USD]

broker:
  name: simulated

risk:
  # Les trois stratégies prennent souvent le même pari en même temps (acheter l'or) :
  # 0,35 % par trade garde le risque total proche de 1 %. Sur 2019-2026 : +137 %,
  # baisse maximale 15 %, Sharpe 1,18 (spread 0,30 $ et glissement compris).
  risk_per_trade_pct: 0.35
  max_open_positions: 3
  max_currency_risk_pct: 3
  max_daily_loss_pct: 3
  max_drawdown_pct: 20

strategies:
  - id: or-tsmom
    kind: tsmom
    instruments: [XAU/USD]
    timeframe: H1
    params:
      direction: long

  - id: or-ema
    kind: ema_cross
    instruments: [XAU/USD]
    timeframe: H1
    params:
      fast: 32
      slow: 128
      stop_loss_pips: 30
      take_profit_pips: 90
      direction: long

  - id: or-cassure
    kind: breakout
    instruments: [XAU/USD]
    timeframe: H1
    params:
      lookback: 120
      atr_stop: 2.5
      take_profit_pips: 150
      direction: long

backtest:
  initial_balance: 10000
  slippage_pips: 0.05
  commission_per_million: 0
